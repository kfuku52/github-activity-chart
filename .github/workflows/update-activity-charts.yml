name: Update activity charts

on:
  schedule:
    # 09:00 on the first day of every month in Japan Standard Time.
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: update-activity-charts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/runtime.lock

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Generate public charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TO_MONTH="$(
            python -c 'from datetime import datetime, timedelta, timezone; now = datetime.now(timezone.utc); print((now.replace(day=1) - timedelta(days=1)).strftime("%Y-%m"))'
          )"
          github-activity-chart kfuku52 \
            --to "${TO_MONTH}" \
            --output output/kfuku52_all_months.png \
            --output output/kfuku52_all_months.pdf

      - name: Upload generated charts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-activity-charts
          path: |
            output/kfuku52_all_months.png
            output/kfuku52_all_months.pdf
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated charts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-activity-charts
          path: output

      - name: Commit updated charts
        run: |
          if git diff --quiet -- \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf; then
            echo "No chart changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf
          git commit -m "Update kfuku52 activity charts"
          git push origin HEAD:main
