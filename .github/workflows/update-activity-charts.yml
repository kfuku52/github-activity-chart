name: Update activity charts

on:
  schedule:
    # 09:00 on the first day of every month in Japan Standard Time.
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ACTIVITY_CHART_TOKEN: ${{ secrets.ACTIVITY_CHART_GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate public charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          github-activity-chart kfuku52 \
            --output output/kfuku52_all_months.png \
            --output output/kfuku52_all_months.pdf

      - name: Generate private-included PDF
        if: env.ACTIVITY_CHART_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ env.ACTIVITY_CHART_TOKEN }}
        run: |
          github-activity-chart kfuku52 \
            --include-private \
            --output output/kfuku52_all_months_with_private.pdf

      - name: Commit updated charts
        run: |
          if git diff --quiet -- \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf \
            output/kfuku52_all_months_with_private.pdf; then
            echo "No chart changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf \
            output/kfuku52_all_months_with_private.pdf
          git commit -m "Update kfuku52 activity charts"
          git push
