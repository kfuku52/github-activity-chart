name: Update activity charts

on:
  schedule:
    # 09:00 on the first day of every month in Japan Standard Time.
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: update-activity-charts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/runtime.lock

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Generate public charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TO_MONTH="$(
            python -c 'from datetime import datetime, timedelta, timezone; now = datetime.now(timezone.utc); print((now.replace(day=1) - timedelta(days=1)).strftime("%Y-%m"))'
          )"
          github-activity-chart kfuku52 \
            --to "${TO_MONTH}" \
            --output output/kfuku52_all_months.png \
            --output output/kfuku52_all_months.pdf

      - name: Upload generated charts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-activity-charts
          path: |
            output/kfuku52_all_months.png
            output/kfuku52_all_months.pdf
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-activity-charts
          path: output

      - name: Commit updated charts
        run: |
          if git diff --quiet -- \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf; then
            echo "No chart changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf
          git commit -m "Update kfuku52 activity charts"
          git push origin HEAD:main
