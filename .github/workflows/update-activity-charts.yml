name: Update activity charts

on:
  schedule:
    # 09:17 on the first day of every month in Japan Standard Time.
    - cron: "17 0 1 * *"
  workflow_dispatch:

concurrency:
  group: update-activity-charts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/runtime.lock

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Generate public charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m githubactivitychart.update_charts

      - name: Upload generated charts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-activity-charts
          path: |
            output/kfuku52_all_months.png
            output/kfuku52_all_months.pdf
            output/kfuku52_last_36_months.svg
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated charts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-activity-charts
          path: output

      - name: Commit updated charts
        run: |
          if git diff --quiet -- \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf \
            output/kfuku52_last_36_months.svg; then
            echo "No chart changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/kfuku52_all_months.png \
            output/kfuku52_all_months.pdf \
            output/kfuku52_last_36_months.svg
          git commit -m "Update kfuku52 activity charts"
          git push origin HEAD:main
