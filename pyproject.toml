[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-activity-chart"
dynamic = ["version"]
description = "Plot monthly GitHub commit contributions as a stacked bar chart by repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8,<4",
  "requests>=2.33,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "pytest-cov>=7.0",
  "pytest>=8.0",
  "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/kfuku52/github-activity-chart"
Repository = "https://github.com/kfuku52/github-activity-chart"

[project.scripts]
github-activity-chart = "githubactivitychart.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "githubactivitychart.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
